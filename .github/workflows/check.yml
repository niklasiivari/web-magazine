name: Check

# Pushes to main and every pull request. `push` is scoped to main so a PR
# branch is not checked twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs pnpm, installs Node through it, and runs the install — the
      # pnpm version comes from package.json's `packageManager`, so there is
      # no second pin here for Renovate to leave behind.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm check
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No third-party dependencies, so there is nothing to cache.
          cache: false
      # The container build already fails on a Go syntax error; these catch
      # formatting drift and the suspicious-construct class of bug that still
      # compiles cleanly.
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            gofmt -d . >&2
            exit 1
          fi
      - run: go vet ./...
      # The server is stdlib-only, so this is really a watch on Go's own
      # standard library — net/http included — for advisories that land
      # without anything in the repo changing.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # Blocking. These are the packages that shape the published build, so
      # an advisory here is one that can reach a reader.
      - run: pnpm audit --audit-level=high --prod
      # Advisory. The dev tree is local tooling — a type checker and a build
      # plugin — that never ships, and it is routinely a few advisories deep
      # through transitive dependencies nobody here can patch. Reported so it
      # is visible, not blocking so it cannot wedge the template.
      - run: pnpm audit --audit-level=high
        continue-on-error: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg SITE_URL=https://magazine.example --tag web-magazine-template .
